name: Download all player skins

on:
  push:
    branches: [main]
    paths:
      - "docs/skins/**.[lmh]male*.[pP][nN][gG]"
      - "docs/skins/**.[lmh]female*.[pP][nN][gG]"
      - "docs/skins/**.[lmh]bioderm*.[pP][nN][gG]"
      - "docs/skins.json"
      - ".github/workflows/player-skins.yml"
      - "buildPlayerSkins*.mjs"
      - "playerSkinRelease*.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: player-skins-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - run: npm test
      - run: npm run build:player-skins

      - name: Prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName \
            --jq '[.[] | select(.tagName | startswith("player-skins-"))][0].tagName // empty')"
          if [[ -n "$previous_tag" ]]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$previous_tag:refs/tags/$previous_tag"
          fi
          release_version="$(date -u +%Y-%m-%d).${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            release_version="${release_version}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "tag=player-skins-${release_version}" >> "$GITHUB_OUTPUT"
          echo "title=$release_version" >> "$GITHUB_OUTPUT"
          PREVIOUS_PLAYER_SKINS_TAG="$previous_tag" node playerSkinRelease.mjs

      - name: Publish player skin downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/player-skins/zPlayerSkins-All.vl2#SD — Standard resolution" \
            "dist/player-skins/zPlayerSkins-All-HD.vl2#HD — QoL patch required" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --latest \
            --notes-file dist/player-skins/release-notes.md
          printf '[View release and downloads](%s/%s/releases/tag/%s)\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat dist/player-skins/release-notes.md >> "$GITHUB_STEP_SUMMARY"
