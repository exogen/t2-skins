name: Download all player skins

on:
  push:
    branches: [main]
    paths:
      - "docs/skins/**.[lmh]male*.[pP][nN][gG]"
      - "docs/skins/**.[lmh]female*.[pP][nN][gG]"
      - "docs/skins/**.[lmh]bioderm*.[pP][nN][gG]"
      - "docs/skins.json"
      - ".github/workflows/player-skins.yml"
      - "buildPlayerSkins*.mjs"
      - "playerSkinRelease*.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: player-skins-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - run: npm test
      - run: npm run build:player-skins

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName \
            --jq '[.[] | select(.tagName | startswith("player-skins-"))][0].tagName // empty')"
          if [[ -n "$previous_tag" ]]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$previous_tag:refs/tags/$previous_tag"
          fi
          release_date="$(date -u +%Y-%m-%d)"
          release_tag="player-skins-${release_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "title=Player skins — ${release_date} (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" >> "$GITHUB_OUTPUT"
          PREVIOUS_PLAYER_SKINS_TAG="$previous_tag" PLAYER_SKINS_TAG="$release_tag" \
            node playerSkinRelease.mjs

      - name: Publish player skin downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" dist/player-skins/*.vl2 \
            dist/player-skins/player-skin-changes.md \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --latest \
            --notes-file dist/player-skins/release-notes.md
          cat dist/player-skins/release-notes.md >> "$GITHUB_STEP_SUMMARY"
